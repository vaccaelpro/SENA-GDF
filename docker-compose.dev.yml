# =========================================================
# DOCKER COMPOSE PARA MODO DESARROLLO (HOT-RELOAD)
# Uso: docker compose -f docker-compose.dev.yml up --build
# =========================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sena-gdf-backend-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=3001
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    networks:
      - sena-network-dev

  frontend:
    image: node:20-alpine
    container_name: sena-gdf-frontend-dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["sh", "-c", "npm install --legacy-peer-deps && npm start"]
    depends_on:
      - backend
    networks:
      - sena-network-dev

networks:
  sena-network-dev:
    driver: bridge
